name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Use the local reusable workflow so CI runs on this fork without
    # requiring cross-org workflow_call access to paperclipai/paperclip.
    # The AWS runner check inside pr-trusted.yml still routes to GitHub-hosted
    # runners for any repo that is not paperclipai/paperclip, so the security
    # boundary is unchanged.
    uses: ./.github/workflows/pr-trusted.yml
